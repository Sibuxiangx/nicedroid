name: Refresh model catalog

# Keeps manifest.json in step with the Droid CLI.
#
# The model catalog lives inside the CLI binary and no API serves it, so
# refreshing means: notice a new version on npm, download that exact build,
# re-extract the registry, cross-check it against the CLI's own model list, and
# commit the result. Nothing here runs on a normal push.
#
# The version is the whole trigger. Extraction is deterministic — the same
# binary always produces byte-identical JSON, with no timestamps — so comparing
# cli.version in the manifest against npm is enough to decide whether there is
# anything to do, and a same-version run cannot produce an empty commit.

on:
  schedule:
    # Daily, a few minutes off the hour to stay clear of the busiest slots.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Re-extract even when the version is unchanged (for extractor changes)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-model-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compare the manifest version against npm
        id: version
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://registry.npmjs.org/@factory/cli/latest |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          current=$(python3 -c 'import json; print(json.load(open("manifest.json"))["cli"]["version"])')
          if [ "$latest" = "$current" ]; then
            echo "manifest is already at droid $current; nothing to do"
            changed=false
          else
            echo "manifest is at $current, npm has $latest"
            changed=true
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "forced: re-extracting droid $latest regardless"
            changed=true
          fi
          {
            echo "latest=$latest"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"

      - name: Download that CLI build
        if: steps.version.outputs.changed == 'true'
        env:
          VER: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          base="https://downloads.factory.ai/factory-cli/releases/$VER/linux/x64"
          curl -fsSL -o /tmp/droid "$base/droid"
          curl -fsSL -o /tmp/droid.sha256 "$base/droid.sha256"
          (cd /tmp && printf '%s  droid\n' "$(cat droid.sha256)" | sha256sum -c -)
          chmod +x /tmp/droid
          # The published version and the build must agree, or the catalog would
          # claim to be a release it was not extracted from.
          built=$(HOME="$(mktemp -d)" /tmp/droid --version)
          echo "downloaded build reports $built"
          if [ "$built" != "$VER" ]; then
            echo "::error::release $VER reports version $built"
            exit 1
          fi

      - name: Re-extract the registry
        if: steps.version.outputs.changed == 'true'
        env:
          VER: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          # The CLI prints its own selectable models in its help text. That list
          # is an independent statement of the catalog, so the extractor refuses
          # to write a manifest missing any model the CLI names, or disagreeing
          # with it about which models are retired.
          HOME="$(mktemp -d)" /tmp/droid exec --help > /tmp/help.txt
          go run ./tools/extract-manifest /tmp/droid \
            --version "$VER" \
            --out manifest.json \
            --cross-check /tmp/help.txt
          extracted=$(python3 -c 'import json; print(json.load(open("manifest.json"))["cli"]["version"])')
          if [ "$extracted" != "$VER" ]; then
            echo "::error::manifest claims $extracted after extracting $VER"
            exit 1
          fi

          # The version-compare gate assumes extraction is deterministic: a
          # run-dependent field would make every scheduled run look like a change.
          go run ./tools/extract-manifest /tmp/droid --version "$VER" --out /tmp/manifest-again.json
          if ! cmp -s manifest.json /tmp/manifest-again.json; then
            echo "::error::extraction is not deterministic; the same binary produced two different manifests"
            diff manifest.json /tmp/manifest-again.json | head -20
            exit 1
          fi
          echo "extraction is deterministic"

      - name: Confirm the gateway still builds and the manifest parses
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          go build ./...
          go test ./internal/config/

      - name: Commit the refreshed catalog
        if: steps.version.outputs.changed == 'true'
        env:
          VER: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          # A forced run on an unchanged version lands here with nothing staged;
          # that is a success, not a commit.
          if git diff --cached --quiet; then
            echo "manifest already matches droid $VER"
            exit 0
          fi
          git commit -m "Refresh model catalog to droid $VER"
          git push
